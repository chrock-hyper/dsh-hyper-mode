<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 工单看板 A/B/C — Kanban + DSH 文档预览</title>
<!--
  原型，用来回答 3 个看板方案选哪个，不进入生产。
  ------------------------------------------------------------
  · 单文件、无外部资源、双击可开（file://）。
  · ?variant=A|B|C 切换结构；底部浮动条与 ←/→ 也能切。
  · ?demo=normal|empty|loading|error|noproject 直接看状态。
  · ?theme=light|dark 亮/暗主题。
  · 数据：两张真实工单 wo-20261115-1/-2（均 done）+ 本单 wo-20261116-1（active）
    + 7 张合成卡片。在制上限设为 5（真实 config 是 2），让「满员降级 intake」可达。
  · 右侧栏是视觉 mock；真实实现调 ctx.get('sidebarRight').openResource(addr)，
    地址由 sessionFileAddress(sessionId, path) 构造。demo 不读文件、不写任何状态。
-->
<style>
/* ============================================================
   1. 设计令牌（沿用上一版面板同款 --dsw-alias-* 兜底色值）
   ============================================================ */
:root {
  color-scheme: light;
  --dsw-alias-bg-base:#f4f5f7;
  --dsw-alias-bg-layer-1:#ffffff;
  --dsw-alias-bg-layer-2:#f8f9fb;
  --dsw-alias-border-l1:#e5e7eb;
  --dsw-alias-border-l2:#d6dae1;
  --dsw-alias-label-primary:#1f2328;
  --dsw-alias-label-secondary:#6b7280;
  --dsw-alias-brand-primary:#2563eb;
  --dsw-alias-state-error-primary:#dc2626;
  --dsw-alias-state-warn-primary:#b45309;
  --dsw-alias-state-success-primary:#16a34a;

  /* demo-only：阶段色、软底、阴影、等宽字体 */
  --k-mute:#9aa1ab;
  --k-soft:#eef1f5;
  --k-soft-2:#f6f8fa;
  --k-chip:#f1f3f7;
  --k-hover:#f3f4f6;
  --k-st-intake:#64748b;
  --k-st-active:#2563eb;
  --k-st-review:#d97706;
  --k-st-blocked:#dc2626;
  --k-st-done:#16803c;
  --k-st-dropped:#9ca3af;
  --k-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --k-shadow-lg:0 10px 30px rgba(16,24,40,.14),0 2px 8px rgba(16,24,40,.08);
  --k-radius:10px;
  --k-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --k-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --dsw-alias-bg-base:#15171b;
  --dsw-alias-bg-layer-1:#1c1f24;
  --dsw-alias-bg-layer-2:#22262c;
  --dsw-alias-border-l1:#2b3037;
  --dsw-alias-border-l2:#3a4048;
  --dsw-alias-label-primary:#e6e8eb;
  --dsw-alias-label-secondary:#9aa1ab;
  --dsw-alias-brand-primary:#6d9bff;
  --dsw-alias-state-error-primary:#f87171;
  --dsw-alias-state-warn-primary:#fbbf24;
  --dsw-alias-state-success-primary:#4ade80;

  --k-mute:#7d858f;
  --k-soft:#2a2f36;
  --k-soft-2:#24282e;
  --k-chip:#2a2f36;
  --k-hover:#282d34;
  --k-st-intake:#94a3b8;
  --k-st-active:#6d9bff;
  --k-st-review:#fbbf24;
  --k-st-blocked:#f87171;
  --k-st-done:#4ade80;
  --k-st-dropped:#6b7280;
  --k-shadow:0 1px 2px rgba(0,0,0,.3);
  --k-shadow-lg:0 14px 34px rgba(0,0,0,.5);
}

* { box-sizing:border-box; }
html, body { height:100%; }
body {
  margin:0; overflow:hidden;
  background:var(--dsw-alias-bg-base); color:var(--dsw-alias-label-primary);
  font:13px/1.55 var(--k-sans);
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
::selection { background:color-mix(in srgb, var(--dsw-alias-brand-primary) 26%, transparent); }
.k-mono { font-family:var(--k-mono); }
.k-mut { color:var(--dsw-alias-label-secondary); }
.k-faint { color:var(--k-mute); }
.k-annot {
  margin:6px 0 0; padding:4px 7px; border-left:2px solid var(--dsw-alias-border-l2);
  font-size:10.5px; line-height:1.5; color:var(--dsw-alias-label-secondary);
  background:var(--k-soft-2); border-radius:0 5px 5px 0;
}
.k-annot b { color:var(--dsw-alias-label-primary); font-weight:600; }

/* ============================================================
   2. 宿主外壳：应用栏 / 会话列表 / 会话头 / 标签栏
   ============================================================ */
.app {
  display:grid;
  grid-template-columns:52px 220px minmax(0,1fr) auto;
  height:100vh; height:100dvh;
  background:var(--dsw-alias-bg-base);
  transition:grid-template-columns .2s ease;
}
.rail {
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:10px 0; background:var(--dsw-alias-bg-layer-2);
  border-right:1px solid var(--dsw-alias-border-l1);
}
.rail-logo {
  width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
  background:var(--dsw-alias-brand-primary); color:#fff; font-weight:700; font-size:13px;
  box-shadow:0 2px 6px color-mix(in srgb, var(--dsw-alias-brand-primary) 40%, transparent);
}
.rail-item {
  width:32px; height:32px; border-radius:8px; display:grid; place-items:center;
  color:var(--dsw-alias-label-secondary); font-size:14px; line-height:1;
}
.rail-item.is-on {
  background:var(--dsw-alias-bg-layer-1); color:var(--dsw-alias-label-primary);
  box-shadow:inset 0 0 0 1px var(--dsw-alias-border-l1);
}
.rail-spacer { flex:1; }
.side {
  display:flex; flex-direction:column; min-height:0; padding:12px 10px 10px;
  background:var(--dsw-alias-bg-layer-2);
  border-right:1px solid var(--dsw-alias-border-l1);
}
.side-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 4px 9px; font-size:11px; font-weight:600; letter-spacing:.08em;
  color:var(--dsw-alias-label-secondary); text-transform:uppercase;
}
.side-plus { font-size:14px; font-weight:400; color:var(--k-mute); }
.side-search {
  display:flex; align-items:center; height:27px; padding:0 8px; margin-bottom:10px;
  border:1px solid var(--dsw-alias-border-l1); border-radius:7px;
  background:var(--dsw-alias-bg-layer-1); color:var(--k-mute); font-size:11.5px;
}
.side-group { padding:6px 4px 4px; font-size:10px; letter-spacing:.08em; color:var(--k-mute); }
.side-row {
  display:flex; flex-direction:column; gap:1px; padding:7px 8px; border-radius:7px;
  color:var(--dsw-alias-label-secondary); cursor:default;
}
.side-row b {
  font-size:12px; font-weight:550; color:var(--dsw-alias-label-primary);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.side-row span { font-size:10.5px; color:var(--k-mute); }
.side-row.is-on { background:var(--k-chip); box-shadow:inset 2px 0 0 var(--dsw-alias-brand-primary); }
.side-row.is-on b { color:var(--dsw-alias-label-primary); }
.side-foot {
  margin-top:auto; padding:9px 6px 2px; border-top:1px solid var(--dsw-alias-border-l1);
  font-size:10.5px; line-height:1.5; color:var(--dsw-alias-label-secondary);
}
.side-foot span { color:var(--k-mute); font-size:10px; }

.main { display:flex; flex-direction:column; min-width:0; min-height:0; }
.sesshead {
  flex:none; padding:13px 18px 0; background:var(--dsw-alias-bg-layer-1);
  border-bottom:1px solid var(--dsw-alias-border-l1);
}
.sessline { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.sess-id { min-width:0; }
.sess-title {
  font-size:14.5px; font-weight:600; line-height:1.35; letter-spacing:.005em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sess-meta {
  display:flex; align-items:center; gap:6px; margin-top:3px;
  font-size:10.5px; color:var(--dsw-alias-label-secondary);
}
.sess-meta .dot { color:var(--k-mute); }
.sess-actions { display:flex; align-items:center; gap:6px; flex:none; padding-top:1px; }
.pill {
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px;
  border:1px solid var(--dsw-alias-border-l1); background:var(--dsw-alias-bg-layer-2);
  font-size:10.5px; color:var(--dsw-alias-label-secondary);
}
.pill::before {
  content:""; width:5px; height:5px; border-radius:50%;
  background:var(--dsw-alias-state-warn-primary);
}
.tabs { display:flex; align-items:flex-end; gap:2px; margin-top:10px; }
.tab {
  position:relative; padding:8px 11px 9px; font-size:12.5px; line-height:1;
  color:var(--dsw-alias-label-secondary); border-bottom:2px solid transparent;
  white-space:nowrap; cursor:default;
}
.tab.is-on {
  color:var(--dsw-alias-label-primary); font-weight:600;
  border-bottom-color:var(--dsw-alias-brand-primary);
}
.tab-spacer { flex:1; }
.tab-hint { padding-bottom:9px; font-size:10.5px; color:var(--k-mute); }

/* 视图区 */
.view {
  flex:1 1 auto; display:flex; flex-direction:column; min-height:0;
  background:var(--dsw-alias-bg-base);
}
.viewhead {
  flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px;
  flex-wrap:wrap; padding:9px 14px;
  background:var(--dsw-alias-bg-layer-1);
  border-bottom:1px solid var(--dsw-alias-border-l1);
}
.viewtitle { display:flex; align-items:center; gap:8px; min-width:0; flex-wrap:wrap; }
.viewtitle h1 {
  margin:0; font-size:15px; font-weight:650; letter-spacing:.005em; line-height:1.2;
}
.viewsub { font-size:10.5px; color:var(--k-mute); }
.stats { display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-left:2px; }
.stat {
  display:inline-flex; align-items:baseline; gap:4px; padding:1px 7px; border-radius:999px;
  border:1px solid var(--dsw-alias-border-l1); background:var(--dsw-alias-bg-layer-2);
  font-size:10px; color:var(--dsw-alias-label-secondary); white-space:nowrap;
}
.stat b { font-size:11.5px; font-weight:650; color:var(--dsw-alias-label-primary); font-variant-numeric:tabular-nums; }
.stat.is-warn { border-color:color-mix(in srgb, var(--dsw-alias-state-warn-primary) 45%, var(--dsw-alias-border-l1)); }
.stat.is-warn b { color:var(--dsw-alias-state-warn-primary); }
.stat.is-danger { border-color:color-mix(in srgb, var(--dsw-alias-state-error-primary) 45%, var(--dsw-alias-border-l1)); }
.stat.is-danger b { color:var(--dsw-alias-state-error-primary); }
.stat.is-ok b { color:var(--dsw-alias-state-success-primary); }
.tools { display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0; }
.demo-strip {
  display:flex; align-items:center; gap:5px; padding:2px 6px; border-radius:8px;
  border:1px dashed color-mix(in srgb, var(--dsw-alias-brand-primary) 45%, var(--dsw-alias-border-l1));
  background:color-mix(in srgb, var(--dsw-alias-brand-primary) 5%, var(--dsw-alias-bg-layer-1));
}
.demo-tag {
  font-size:8.5px; letter-spacing:.08em; font-weight:700; line-height:1.5;
  color:var(--dsw-alias-brand-primary); border:1px solid currentColor;
  border-radius:3px; padding:0 3px;
}
.demo-label { font-size:10px; color:var(--dsw-alias-label-secondary); }
.seg {
  display:flex; gap:2px; padding:2px; border-radius:8px;
  border:1px solid var(--dsw-alias-border-l1); background:var(--dsw-alias-bg-layer-2);
}
.seg-btn {
  border:0; background:none; padding:2px 8px; border-radius:6px;
  font-size:11.5px; color:var(--dsw-alias-label-secondary); white-space:nowrap;
}
.seg-btn:hover { color:var(--dsw-alias-label-primary); }
.seg-btn.is-on {
  background:var(--dsw-alias-bg-layer-1); color:var(--dsw-alias-label-primary);
  font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.k-btn {
  display:inline-flex; align-items:center; justify-content:center; gap:4px;
  padding:4px 10px; border-radius:7px; border:1px solid var(--dsw-alias-border-l1);
  background:var(--dsw-alias-bg-layer-1); color:var(--dsw-alias-label-primary);
  font-size:12px; line-height:1.5; white-space:nowrap;
}
.k-btn:hover:not(:disabled) {
  border-color:var(--dsw-alias-border-l2);
  background:color-mix(in srgb, var(--dsw-alias-label-primary) 3%, var(--dsw-alias-bg-layer-1));
}
.k-btn:disabled { opacity:.45; cursor:default; }
.k-btn-sm { padding:2px 8px; font-size:11.5px; }
.k-btn-primary {
  background:var(--dsw-alias-brand-primary); border-color:var(--dsw-alias-brand-primary);
  color:#fff;
}
.k-btn-primary:hover:not(:disabled) {
  background:color-mix(in srgb, var(--dsw-alias-brand-primary) 88%, #000);
  border-color:color-mix(in srgb, var(--dsw-alias-brand-primary) 88%, #000);
}
.k-btn-danger {
  color:var(--dsw-alias-state-error-primary);
  border-color:color-mix(in srgb, var(--dsw-alias-state-error-primary) 45%, var(--dsw-alias-border-l1));
}
.k-btn-ghost { border-color:transparent; background:transparent; color:var(--dsw-alias-label-secondary); }
.k-btn-ghost:hover:not(:disabled) { background:var(--k-hover); }
.k-select, .k-input, .k-textarea {
  border:1px solid var(--dsw-alias-border-l1); border-radius:7px;
  background:var(--dsw-alias-bg-layer-1); color:inherit; font-size:12px;
  padding:4px 7px; outline:none; min-width:0;
}
.k-select { padding-right:20px; }
.k-select:focus, .k-input:focus, .k-textarea:focus {
  border-color:var(--dsw-alias-brand-primary);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--dsw-alias-brand-primary) 16%, transparent);
}
.k-textarea {
  width:100%; resize:vertical; min-height:58px; line-height:1.5;
  font-family:var(--k-mono); font-size:11.5px;
}
.k-input { width:100%; }

.banner-layer { flex:none; display:flex; flex-direction:column; gap:5px; }
.banner {
  display:flex; align-items:flex-start; gap:8px; margin:7px 14px 0;
  padding:6px 9px; border-radius:8px; border:1px solid var(--dsw-alias-border-l1);
  background:var(--dsw-alias-bg-layer-1); font-size:11.5px; line-height:1.5;
}
.banner.is-info { border-color:color-mix(in srgb, var(--dsw-alias-brand-primary) 38%, var(--dsw-alias-border-l1)); background:color-mix(in srgb, var(--dsw-alias-brand-primary) 6%, var(--dsw-alias-bg-layer-1)); }
.banner.is-warn { border-color:color-mix(in srgb, var(--dsw-alias-state-warn-primary) 42%, var(--dsw-alias-border-l1)); background:color-mix(in srgb, var(--dsw-alias-state-warn-primary) 7%, var(--dsw-alias-bg-layer-1)); }
.banner.is-error { border-color:var(--dsw-alias-state-error-primary); background:color-mix(in srgb, var(--dsw-alias-state-error-primary) 7%, var(--dsw-alias-bg-layer-1)); }
.banner.is-success { border-color:color-mix(in srgb, var(--dsw-alias-state-success-primary) 42%, var(--dsw-alias-border-l1)); background:color-mix(in srgb, var(--dsw-alias-state-success-primary) 7%, var(--dsw-alias-bg-layer-1)); }
.banner-ic { flex:none; font-size:12px; line-height:1.5; }
.banner-main { flex:1 1 auto; min-width:0; }
.banner-title { font-weight:600; }
.banner-body { margin:1px 0 0; white-space:pre-line; color:var(--dsw-alias-label-secondary); }
.banner-code {
  display:inline-block; margin-top:2px; padding:0 4px; border-radius:4px;
  font-family:var(--k-mono); font-size:9.5px; color:var(--dsw-alias-label-secondary);
  background:var(--k-chip);
}
.banner-close {
  flex:none; border:0; background:none; color:var(--k-mute); font-size:14px;
  line-height:1; padding:0 2px;
}
.banner-close:hover { color:var(--dsw-alias-label-primary); }

.variant-root { flex:1 1 auto; display:flex; flex-direction:column; min-height:0; padding-bottom:52px; }
.v { flex:1 1 auto; display:flex; min-height:0; }
.v-a, .v-b { flex-direction:column; }

/* ============================================================
   3. 通用卡片 / 详情 / 交付物 / 日志 / 签收
   ============================================================ */
.k-card {
  position:relative; display:flex; flex-direction:column; gap:5px;
  border:1px solid var(--dsw-alias-border-l1); border-radius:8px;
  background:var(--dsw-alias-bg-layer-1); box-shadow:var(--k-shadow);
  padding:8px 9px; cursor:pointer; text-align:left; color:inherit;
  transition:border-color .12s ease, box-shadow .12s ease, transform .12s ease;
}
.k-card:hover { border-color:var(--dsw-alias-border-l2); transform:translateY(-1px); }
.k-card.is-on {
  border-color:var(--dsw-alias-brand-primary);
  box-shadow:inset 2px 0 0 var(--dsw-alias-brand-primary), var(--k-shadow);
}
.k-card.is-dragging { opacity:.45; }
.k-card.is-bounce { animation:bounceBack .34s ease; }
.k-card-title {
  font-size:12.5px; font-weight:550; line-height:1.42; letter-spacing:.002em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; word-break:break-word;
}
.k-card-meta {
  display:flex; align-items:center; flex-wrap:wrap; gap:4px;
  font-size:10px; color:var(--dsw-alias-label-secondary);
}
.k-card-warns { display:flex; align-items:center; flex-wrap:wrap; gap:4px; }
.k-card-foot {
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  margin-top:1px; font-size:9.5px; color:var(--k-mute); font-variant-numeric:tabular-nums;
}
.k-chip {
  display:inline-flex; align-items:center; gap:3px; max-width:100%;
  padding:0 5px; border-radius:999px; border:1px solid var(--dsw-alias-border-l1);
  background:var(--k-chip); color:var(--dsw-alias-label-secondary);
  font-size:9.5px; line-height:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.k-chip-size {
  font-family:var(--k-mono); font-weight:650; color:var(--dsw-alias-label-primary);
  border-color:var(--dsw-alias-border-l2); background:transparent;
}
.k-chip-warn {
  color:var(--dsw-alias-state-warn-primary);
  border-color:color-mix(in srgb, var(--dsw-alias-state-warn-primary) 42%, var(--dsw-alias-border-l1));
  background:color-mix(in srgb, var(--dsw-alias-state-warn-primary) 9%, var(--dsw-alias-bg-layer-1));
}
.k-chip-danger {
  color:var(--dsw-alias-state-error-primary);
  border-color:color-mix(in srgb, var(--dsw-alias-state-error-primary) 45%, var(--dsw-alias-border-l1));
  background:color-mix(in srgb, var(--dsw-alias-state-error-primary) 9%, var(--dsw-alias-bg-layer-1));
}
.k-chip-ok {
  color:var(--dsw-alias-state-success-primary);
  border-color:color-mix(in srgb, var(--dsw-alias-state-success-primary) 40%, var(--dsw-alias-border-l1));
  background:color-mix(in srgb, var(--dsw-alias-state-success-primary) 8%, var(--dsw-alias-bg-layer-1));
}
.k-chip-global { border-style:dashed; color:var(--k-mute); background:transparent; }
.stage-dot {
  flex:none; width:7px; height:7px; border-radius:50%;
  background:var(--k-st-intake);
}
.is-intake { --k-st:var(--k-st-intake); }
.is-active { --k-st:var(--k-st-active); }
.is-review { --k-st:var(--k-st-review); }
.is-blocked { --k-st:var(--k-st-blocked); }
.is-done { --k-st:var(--k-st-done); }
.is-dropped { --k-st:var(--k-st-dropped); }
.stage-dot.is-intake { background:var(--k-st-intake); }
.stage-dot.is-active { background:var(--k-st-active); }
.stage-dot.is-review { background:var(--k-st-review); }
.stage-dot.is-blocked { background:var(--k-st-blocked); }
.stage-dot.is-done { background:var(--k-st-done); }
.stage-dot.is-dropped { background:var(--k-st-dropped); }
.k-stage-text { font-family:var(--k-mono); font-size:11px; letter-spacing:.02em; }

/* 详情区块 */
.d-head { display:flex; align-items:flex-start; gap:8px; }
.d-headmain { min-width:0; flex:1 1 auto; }
.d-title { margin:0; font-size:14px; font-weight:600; line-height:1.4; word-break:break-word; }
.d-idline {
  display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin-top:3px;
  font-size:10px; color:var(--k-mute);
}
.d-close {
  flex:none; width:24px; height:24px; border-radius:6px; border:1px solid transparent;
  background:none; color:var(--k-mute); font-size:15px; line-height:1;
}
.d-close:hover { background:var(--k-hover); color:var(--dsw-alias-label-primary); }
.d-sec { border-top:1px solid var(--dsw-alias-border-l1); padding:8px 0 1px; }
.d-sec:first-of-type { border-top:0; padding-top:2px; }
.d-label {
  margin:0 0 4px; font-size:9.5px; font-weight:650; letter-spacing:.07em;
  text-transform:uppercase; color:var(--k-mute);
}
.d-stage { display:flex; align-items:center; gap:6px; font-weight:600; font-size:13px; }
.d-stage .k-stage-text { font-size:12.5px; }
.d-sub { margin:2px 0 0; font-size:11px; color:var(--dsw-alias-label-secondary); }
.d-list { margin:0; padding:0 0 0 15px; font-size:11.5px; line-height:1.55; }
.d-list li { margin:1px 0; word-break:break-word; }
.d-warnbox {
  margin:2px 0 0; padding:5px 7px; border-radius:6px; border:1px solid;
  font-size:10.5px; line-height:1.5;
}
.d-warnbox.is-warn {
  border-color:color-mix(in srgb, var(--dsw-alias-state-warn-primary) 45%, var(--dsw-alias-border-l1));
  color:var(--dsw-alias-state-warn-primary);
  background:color-mix(in srgb, var(--dsw-alias-state-warn-primary) 8%, var(--dsw-alias-bg-layer-1));
}
.d-warnbox.is-danger {
  border-color:color-mix(in srgb, var(--dsw-alias-state-error-primary) 45%, var(--dsw-alias-border-l1));
  color:var(--dsw-alias-state-error-primary);
  background:color-mix(in srgb, var(--dsw-alias-state-error-primary) 7%, var(--dsw-alias-bg-layer-1));
}
.d-actions { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:3px; }
.d-actions .k-select { font-size:11px; padding:3px 6px; }
.d-actions .hint { font-size:9.5px; color:var(--k-mute); }

/* 交付物 */
.art-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
.art-row {
  display:flex; flex-direction:column; gap:3px; padding:5px 6px;
  border:1px solid var(--dsw-alias-border-l1); border-radius:6px;
  background:var(--dsw-alias-bg-layer-2);
}
.art-row.is-missing {
  border-color:color-mix(in srgb, var(--dsw-alias-state-error-primary) 55%, var(--dsw-alias-border-l1));
  background:color-mix(in srgb, var(--dsw-alias-state-error-primary) 6%, var(--dsw-alias-bg-layer-1));
}
.art-top { display:flex; align-items:flex-start; gap:5px; min-width:0; }
.art-path {
  flex:1 1 auto; min-width:0; font-family:var(--k-mono); font-size:10px;
  line-height:1.5; word-break:break-all; color:var(--dsw-alias-label-primary);
}

.art-kind { flex:none; font-size:9px; color:var(--k-mute); }
.art-status { flex:none; font-size:9px; color:var(--dsw-alias-state-error-primary); }
.art-open {
  align-self:flex-start; border:0; background:none; padding:0 1px;
  color:var(--dsw-alias-brand-primary); font-size:10.5px; line-height:1.6;
}
.art-open:hover:not(:disabled) { text-decoration:underline; }
.art-open:disabled { color:var(--k-mute); cursor:default; }
.art-reason { font-size:9.5px; color:var(--k-mute); }
.art-reason.is-danger { color:var(--dsw-alias-state-error-primary); }

/* 日志 */
.log { display:flex; flex-direction:column; gap:6px; }
.log-scroll { max-height:240px; overflow:auto; padding-right:2px; }
.log-row { border-left:2px solid var(--dsw-alias-border-l2); padding-left:7px; }
.log-meta {
  display:flex; align-items:center; gap:5px; font-size:9.5px; color:var(--k-mute);
  font-family:var(--k-mono);
}
.log-by { color:var(--dsw-alias-label-secondary); font-family:var(--k-sans); }
.log-note {
  margin:1px 0 0; font-size:11px; line-height:1.55; white-space:pre-wrap;
  word-break:break-word; color:var(--dsw-alias-label-primary);
}
.log-count { font-size:9.5px; color:var(--k-mute); }

/* 签收 */
.sign {
  margin-top:8px; padding:7px 8px 8px; border-radius:8px;
  border:1px solid var(--dsw-alias-border-l1); background:var(--dsw-alias-bg-layer-2);
}
.sign-head { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:5px; }
.sign-head h4 { margin:0; font-size:11px; font-weight:650; }
.sign-actor {
  font-size:9.5px; color:var(--dsw-alias-label-secondary); white-space:nowrap;
  padding:0 5px; border-radius:999px; border:1px solid var(--dsw-alias-border-l1);
  background:var(--dsw-alias-bg-layer-1);
}
.sign-note { min-height:52px; }
.sign-hint { margin:3px 0 0; font-size:9.5px; color:var(--dsw-alias-state-warn-primary); }
.sign-hint.is-ok { color:var(--dsw-alias-state-success-primary); }
.sign-blk { list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; }
.sign-blk li { font-size:9.5px; line-height:1.45; color:var(--dsw-alias-state-warn-primary); }
.sign-blk li .code {
  font-family:var(--k-mono); font-size:8.5px; margin-right:3px; opacity:.85;
}
.sign-blk li.is-danger { color:var(--dsw-alias-state-error-primary); }
.sign-btns { display:flex; gap:5px; justify-content:flex-end; margin-top:6px; }
.sign-btns .k-btn { padding:3px 8px; font-size:10.5px; }
.sign-locked {
  margin:0; padding:5px 7px; border-radius:6px; background:var(--dsw-alias-bg-layer-1);
  border:1px dashed var(--dsw-alias-border-l1); font-size:10.5px; color:var(--dsw-alias-label-secondary);
}

/* ============================================================
   4. A 方案：经典阶段列 + 右侧抽屉
   ============================================================ */
.v-a { flex-direction:column; gap:8px; padding:9px 12px 4px; }
.a-main { display:flex; flex:1 1 auto; min-height:0; gap:9px; }
.a-board {
  flex:1 1 auto; min-width:0; display:grid;
  grid-template-columns:repeat(5,minmax(202px,1fr));
  gap:8px; overflow-x:auto; overflow-y:hidden; padding-bottom:2px;
}
.a-col {
  display:flex; flex-direction:column; min-height:0; min-width:0;
  border:1px solid var(--dsw-alias-border-l1); border-radius:var(--k-radius);
  background:var(--dsw-alias-bg-layer-1); overflow:hidden;
  transition:border-color .12s ease, background .12s ease;
}
.a-col.is-drag {
  border-color:var(--dsw-alias-brand-primary);
  background:color-mix(in srgb, var(--dsw-alias-brand-primary) 4%, var(--dsw-alias-bg-layer-1));
  box-shadow:inset 0 0 0 1px var(--dsw-alias-brand-primary);
}
.a-col.is-bad { border-color:var(--dsw-alias-state-error-primary); animation:shake .3s ease; }
.a-colhead {
  flex:none; display:flex; align-items:center; gap:5px; padding:7px 8px;
  border-bottom:1px solid var(--dsw-alias-border-l1);
  background:var(--dsw-alias-bg-layer-2); border-top:2px solid var(--k-st);
  font-size:11px; min-width:0;
}
.a-colhead .stage-key { font-family:var(--k-mono); font-weight:650; letter-spacing:.01em; }
.a-colhead .stage-sub { font-size:9.5px; color:var(--k-mute); white-space:nowrap; }
.a-count {
  margin-left:auto; flex:none; min-width:17px; text-align:center;
  padding:0 5px; border-radius:999px; background:var(--k-chip);
  border:1px solid var(--dsw-alias-border-l1);
  font-size:9.5px; color:var(--dsw-alias-label-secondary); font-variant-numeric:tabular-nums;
}
.a-colbody {
  flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
  padding:6px; display:flex; flex-direction:column; gap:6px;
}
.a-colfoot {
  flex:none; display:flex; align-items:center; justify-content:space-between; gap:5px;
  padding:5px 7px; border-top:1px solid var(--dsw-alias-border-l1);
  font-size:9px; color:var(--k-mute); background:var(--dsw-alias-bg-layer-2);
}
.a-colnone {
  display:grid; place-items:center; min-height:46px; border-radius:7px;
  border:1px dashed var(--dsw-alias-border-l1); color:var(--k-mute); font-size:10px;
  text-align:center; padding:6px;
}
.a-drawer {
  flex:none; width:382px; min-height:0; display:flex; flex-direction:column;
  border:1px solid var(--dsw-alias-border-l1); border-radius:var(--k-radius);
  background:var(--dsw-alias-bg-layer-1); overflow:hidden;
  animation:drawerIn .18s ease-out; box-shadow:var(--k-shadow);
}
.a-drawer-scroll { flex:1 1 auto; min-height:0; overflow-y:auto; padding:11px 12px 14px; }
.a-drawer .d-head { margin-bottom:6px; }
.a-archive {
  flex:none; display:flex; align-items:center; gap:8px; min-height:30px;
  padding:3px 8px; border:1px dashed var(--dsw-alias-border-l1); border-radius:8px;
  background:var(--dsw-alias-bg-layer-2); font-size:10px; color:var(--k-mute);
  transition:border-color .12s ease, background .12s ease;
}
.a-archive.is-drag {
  border-color:var(--dsw-alias-state-error-primary);
  color:var(--dsw-alias-state-error-primary);
  background:color-mix(in srgb, var(--dsw-alias-state-error-primary) 6%, var(--dsw-alias-bg-layer-1));
}
.a-archive-btn {
  display:flex; align-items:center; gap:6px; border:0; background:none;
  color:inherit; font-size:10px; padding:0; max-width:100%;
}
.a-arch-list { display:flex; gap:6px; align-items:center; overflow-x:auto; padding-bottom:2px; }
.a-arch-card {
  flex:none; width:250px; padding:5px 7px; border-radius:9px;
  border:1px solid var(--dsw-alias-border-l1); background:var(--dsw-alias-bg-layer-1);
}
.a-arch-card .k-card-title { font-size:11px; -webkit-line-clamp:1; color:var(--dsw-alias-label-secondary); }
.a-arch-card .k-card-meta { font-size:9px; }
.a-onboard, .b-onboard {
  flex:none; display:flex; align-items:center; gap:12px; padding:9px 12px;
  border:1px solid color-mix(in srgb, var(--dsw-alias-brand-primary) 30%, var(--dsw-alias-border-l1));
  border-radius:var(--k-radius);
  background:color-mix(in srgb, var(--dsw-alias-brand-primary) 5%, var(--dsw-alias-bg-layer-1));
}
.empty-ic {
  flex:none; width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
  border:1px dashed var(--dsw-alias-brand-primary); color:var(--dsw-alias-brand-primary);
  font-size:16px; background:var(--dsw-alias-bg-layer-1);
}
.a-onboard .onboard-main, .b-onboard .onboard-main { flex:1 1 auto; min-width:0; }
.a-onboard b, .b-onboard b { font-size:12.5px; }
.a-onboard p, .b-onboard p { margin:1px 0 0; font-size:10.5px; color:var(--dsw-alias-label-secondary); }
.empty-steps { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
.empty-steps span {
  padding:1px 6px; border-radius:999px; background:var(--dsw-alias-bg-layer-1);
  border:1px solid var(--dsw-alias-border-l1); font-size:9.5px; color:var(--dsw-alias-label-secondary);
}

/* ============================================================
   5. B 方案：横向阶段泳道 + 底部 inspector
   ============================================================ */
.v-b { flex-direction:column; gap:6px; padding:9px 12px 4px; }
.b-lanes {
  flex:1 1 auto; min-height:0; display:grid;
  grid-template-rows:repeat(5,minmax(0,1fr)); gap:5px;
}
.b-lane {
  display:grid; grid-template-columns:98px minmax(0,1fr); min-height:0;
  border:1px solid var(--dsw-alias-border-l1); border-radius:9px;
  background:var(--dsw-alias-bg-layer-1); overflow:hidden;
  transition:border-color .12s ease, background .12s ease;
}
.b-lane.is-drag {
  border-color:var(--dsw-alias-brand-primary);
  background:color-mix(in srgb, var(--dsw-alias-brand-primary) 4%, var(--dsw-alias-bg-layer-1));
  box-shadow:inset 0 0 0 1px var(--dsw-alias-brand-primary);
}
.b-lane.is-bad { border-color:var(--dsw-alias-state-error-primary); animation:shake .3s ease; }
.b-lanelabel {
  display:flex; flex-direction:column; justify-content:center; gap:2px; min-width:0;
  padding:5px 8px; border-right:1px solid var(--dsw-alias-border-l1);
  border-left:3px solid var(--k-st); background:var(--dsw-alias-bg-layer-2);
}
.b-lanelabel .l1 {
  display:flex; align-items:center; gap:5px; font-family:var(--k-mono);
  font-size:11px; font-weight:650; min-width:0;
}
.b-lanelabel .l2 {
  display:flex; align-items:center; gap:5px; font-size:9px; color:var(--k-mute);
  white-space:nowrap; overflow:hidden;
}
.b-count {
  margin-left:auto; padding:0 5px; border-radius:999px; background:var(--k-chip);
  border:1px solid var(--dsw-alias-border-l1); font-size:9px;
  color:var(--dsw-alias-label-secondary); font-variant-numeric:tabular-nums;
}
.b-lanecards {
  display:flex; align-items:center; gap:6px; min-width:0;
  padding:5px 7px; overflow-x:auto; overflow-y:hidden;
}
.b-card {
  flex:none; width:298px; max-height:100%; justify-content:center;
  padding:6px 8px; gap:3px;
}
.b-card .k-card-title { font-size:11.5px; line-height:1.38; }
.b-card .k-card-meta { font-size:9.5px; gap:3px; }
.b-card .k-card-warns:empty { display:none; }
.b-laneempty {
  display:flex; align-items:center; gap:5px; padding:6px 9px; border-radius:7px;
  border:1px dashed var(--dsw-alias-border-l1); color:var(--k-mute); font-size:9.5px;
  white-space:nowrap;
}
.b-archive {
  flex:none; display:flex; align-items:center; gap:7px; min-height:27px;
  padding:2px 8px; border:1px dashed var(--dsw-alias-border-l1); border-radius:7px;
  background:var(--dsw-alias-bg-layer-2); font-size:9.5px; color:var(--k-mute);
}
.b-archive.is-drag {
  border-color:var(--dsw-alias-state-error-primary);
  color:var(--dsw-alias-state-error-primary);
}
.b-archive .a-arch-card { width:230px; padding:3px 6px; }
.b-archive .a-arch-card .k-card-title { font-size:10px; }
.b-inspector {
  flex:none; height:52px; border:1px solid var(--dsw-alias-border-l1);
  border-radius:var(--k-radius); background:var(--dsw-alias-bg-layer-1);
  overflow:hidden; transition:height .18s ease;
}
.b-inspector.is-open { height:224px; }
.b-ins-head {
  display:flex; align-items:center; gap:8px; min-height:38px; padding:6px 9px;
  border-bottom:1px solid var(--dsw-alias-border-l1);
}
.b-ins-head .d-head { flex:1 1 auto; min-width:0; align-items:center; }
.b-ins-head .d-title { font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.b-ins-head .d-idline { margin-top:1px; }
.b-ins-hint { display:flex; align-items:center; gap:7px; font-size:10px; color:var(--k-mute); }
.b-ins-hint b { color:var(--dsw-alias-label-primary); font-weight:600; }
.b-ins-body {
  display:grid; grid-template-columns:148px minmax(0,1fr) minmax(0,1.12fr) minmax(0,1.35fr);
  gap:9px; height:calc(100% - 39px); padding:7px 9px 9px; min-height:0;
}
.b-ins-col { min-width:0; overflow-y:auto; padding-left:9px; border-left:1px dashed var(--dsw-alias-border-l1); }
.b-ins-col:first-child { border-left:0; padding-left:0; }
.b-ins-col > .d-sec { border-top:0; padding:0 0 5px; }
.b-ins-col .d-label { margin-bottom:2px; }
.b-ins-col .log-scroll { max-height:none; }
.b-ins-col .sign { margin-top:6px; }
.b-ins-empty { display:grid; place-items:center; height:100%; color:var(--k-mute); font-size:10.5px; }

/* ============================================================
   6. C 方案：竖向阶段轨 + 单阶段聚焦 + 右侧检查器
   ============================================================ */
.v-c { gap:9px; padding:9px 12px 4px; }
.c-rail {
  flex:none; width:194px; display:flex; flex-direction:column; gap:3px;
  min-height:0; overflow-y:auto; padding:7px;
  border:1px solid var(--dsw-alias-border-l1); border-radius:var(--k-radius);
  background:var(--dsw-alias-bg-layer-1);
}
.c-wip {
  flex:none; margin-bottom:5px; padding:7px 8px; border-radius:8px;
  border:1px solid var(--dsw-alias-border-l1); background:var(--dsw-alias-bg-layer-2);
}
.c-wip-row {
  display:flex; align-items:baseline; justify-content:space-between; gap:6px;
  font-size:10px; color:var(--dsw-alias-label-secondary);
}
.c-wip-row b { font-size:12.5px; color:var(--dsw-alias-label-primary); font-variant-numeric:tabular-nums; }
.c-wip-over { color:var(--dsw-alias-state-warn-primary); }
.c-gauge { display:flex; gap:3px; margin-top:6px; height:5px; }
.c-gauge i { flex:1 1 0; border-radius:2px; background:var(--k-soft); display:block; }
.c-gauge i.is-on { background:var(--dsw-alias-brand-primary); }
.c-gauge i.is-over { background:var(--dsw-alias-state-error-primary); }
.c-stagebtn {
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center;
  gap:6px; padding:7px 7px; border-radius:7px; border:1px solid transparent;
  background:none; text-align:left; color:var(--dsw-alias-label-secondary); font-size:11px;
}
.c-stagebtn:hover { background:var(--k-hover); }
.c-stagebtn.is-on {
  background:color-mix(in srgb, var(--dsw-alias-brand-primary) 10%, var(--dsw-alias-bg-layer-1));
  border-color:color-mix(in srgb, var(--dsw-alias-brand-primary) 36%, var(--dsw-alias-border-l1));
  color:var(--dsw-alias-label-primary);
}
.c-stagebtn .name { font-family:var(--k-mono); font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.c-stagebtn .sub { grid-column:1 / -1; margin-left:13px; font-size:9px; color:var(--k-mute); }
.c-stagebtn .n {
  font-size:9.5px; color:var(--dsw-alias-label-secondary); font-variant-numeric:tabular-nums;
  padding:0 5px; border-radius:999px; background:var(--k-chip);
  border:1px solid var(--dsw-alias-border-l1);
}
.c-stagebtn.is-dropped { margin-top:auto; opacity:.72; }
.c-railnote {
  flex:none; margin-top:4px; padding:4px 5px; font-size:9px; line-height:1.45;
  color:var(--k-mute); border-top:1px dashed var(--dsw-alias-border-l1);
}
.c-center { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:6px; }
.c-streamhead {
  flex:none; display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  padding:7px 9px; border:1px solid var(--dsw-alias-border-l1);
  border-radius:9px; background:var(--dsw-alias-bg-layer-1); font-size:10px;
  color:var(--dsw-alias-label-secondary);
}
.c-streamhead b { font-family:var(--k-mono); font-size:12.5px; color:var(--dsw-alias-label-primary); }
.c-streamhead .sep { color:var(--k-mute); }
.c-streamhead .spacer { flex:1 1 auto; }
.c-streamhead .hint { font-size:9px; color:var(--k-mute); white-space:nowrap; }
.c-stream { flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-right:2px; }
.c-card { gap:4px; padding:8px 9px; }
.c-card .k-card-title { -webkit-line-clamp:2; font-size:12.5px; }
.c-card-snippet {
  font-size:9.5px; color:var(--k-mute); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; border-top:1px dashed var(--dsw-alias-border-l1); padding-top:3px;
}
.c-inspector {
  flex:none; width:306px; display:flex; flex-direction:column; min-height:0;
  border:1px solid var(--dsw-alias-border-l1); border-radius:var(--k-radius);
  background:var(--dsw-alias-bg-layer-1); overflow:hidden;
}
.c-detail { flex:1 1 auto; min-height:0; overflow-y:auto; padding:10px 11px 14px; }
.c-placeholder {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:20px 14px; text-align:center; color:var(--k-mute); font-size:10.5px;
}
.c-placeholder .big { font-size:22px; color:var(--dsw-alias-border-l2); }
.c-empty-main {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; padding:26px 18px; text-align:center; border:1px dashed var(--dsw-alias-border-l1);
  border-radius:var(--k-radius); background:var(--dsw-alias-bg-layer-1);
}
.c-empty-main b { font-size:13px; }
.c-empty-main p { margin:0; max-width:380px; font-size:10.5px; color:var(--dsw-alias-label-secondary); }

/* ============================================================

.skel-line.w85 { width:85%; }
.skel-line.w40 { width:40%; }
.load-strip {

}

.spin {
  width:11px; height:11px; border-radius:50%; flex:none;

}
.err-panel {
  flex:none; display:flex; align-items:flex-start; gap:10px; margin:7px 14px 0;
  padding:9px 11px; border:1px solid var(--dsw-alias-state-error-primary);

}
.err-panel .ic {
  flex:none; width:22px; height:22px; display:grid; place-items:center;
  border-radius:50%; color:#fff; background:var(--dsw-alias-state-error-primary);
  font-size:13px; font-weight:700; line-height:1;
}
.err-panel .body { flex:1; min-width:0; }
.err-panel b { font-size:12px; }
.err-panel pre {
  margin:4px 0 0; padding:5px 7px; border-radius:6px; overflow:auto;
  background:var(--dsw-alias-bg-layer-1); border:1px solid var(--dsw-alias-border-l1);
  font-family:var(--k-mono); font-size:9.5px; line-height:1.55; color:var(--dsw-alias-label-secondary);
}
.err-panel .actions { display:flex; gap:6px; align-items:center; padding-top:1px; }
.err-cell {
  display:grid; place-items:center; gap:3px; min-height:60px; padding:8px;
  border:1px dashed color-mix(in srgb, var(--dsw-alias-state-error-primary) 45%, var(--dsw-alias-border-l1));
  border-radius:7px; color:var(--dsw-alias-state-error-primary); font-size:9.5px; text-align:center;
}
.a-board.is-err, .b-lanes.is-err { opacity:.72; }
.v-a.is-err .a-colbody, .v-b.is-err .b-lanecards { pointer-events:none; }

/* ============================================================
   8. 右侧栏预览 mock + 底部切换条 + 弹窗 + toast
   ============================================================ */
.preview-col {
  position:relative; width:0; min-width:0; overflow:hidden;

}
.app:not(.pv-open) .preview-col { border-left-color:transparent; }
.app.pv-open .preview-col { width:min(424px, 42vw); }
.pv-inner {
  position:absolute; top:0; right:0; bottom:0; width:min(424px, 42vw);
  display:flex; flex-direction:column; min-height:0;
  background:var(--dsw-alias-bg-layer-1);
  transform:translateX(16px); opacity:0;
  transition:transform .2s ease, opacity .2s ease;
}
.app.pv-open .pv-inner { transform:none; opacity:1; }
.pv-top {
  flex:none; display:flex; align-items:center; gap:6px;

}
.pv-title { font-size:12px; font-weight:650; letter-spacing:.01em; }
.pv-mocktag {

}

.pv-top .k-btn { padding:1px 6px; font-size:9.5px; }
.pv-file {

}
.pv-kind {
  flex:none; display:inline-grid; place-items:center; width:26px; height:20px;
  border-radius:4px; border:1px solid var(--dsw-alias-border-l1);

}
.pv-path {
  flex:1 1 auto; min-width:0; font-family:var(--k-mono); font-size:10px;
  color:var(--dsw-alias-label-secondary); overflow:hidden; text-overflow:ellipsis;

}
.pv-controls {
  flex:none; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  padding:5px 11px; border-bottom:1px solid var(--dsw-alias-border-l1);
  background:var(--dsw-alias-bg-layer-2); font-size:9.5px; color:var(--dsw-alias-label-secondary);
}
.pv-controls .k-select { font-size:9.5px; padding:1px 16px 1px 5px; border-radius:5px; }
.pv-switch {
  display:inline-flex; align-items:center; gap:4px; padding:1px 5px; border-radius:5px;
  border:1px solid var(--dsw-alias-border-l1); background:var(--dsw-alias-bg-layer-1);
  font-size:9.5px; color:var(--dsw-alias-label-secondary);
}
.pv-switch i {

}

}

.pv-reload { margin-left:auto; display:inline-flex; align-items:center; gap:4px; }

.pv-body { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:12px 13px 16px; }
.pv-footer {

}
.pv-addr-head {
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  font-size:9px; color:var(--k-mute); margin-bottom:3px;
  letter-spacing:.04em; text-transform:uppercase;
}
.pv-addr {
  display:block; max-height:60px; overflow:auto; padding:4px 6px; border-radius:5px;
  border:1px solid var(--dsw-alias-border-l1); background:var(--dsw-alias-bg-layer-1);
  font-family:var(--k-mono); font-size:8.5px; line-height:1.5;
  word-break:break-all; color:var(--dsw-alias-label-secondary);
}

  display:flex; align-items:flex-start; gap:5px; margin-top:5px;
  font-size:9px; line-height:1.45; color:var(--k-mute);
}
.pv-real-tag {
  flex:none; padding:0 4px; border-radius:3px;
  border:1px solid var(--dsw-alias-brand-primary);
  color:var(--dsw-alias-brand-primary); font-size:8px; line-height:1.5;
}
.pv-real code { font-family:var(--k-mono); font-size:8.5px; color:var(--dsw-alias-label-secondary); }
.pv-empty {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; gap:5px; text-align:center; color:var(--k-mute); font-size:10.5px;
}
.pv-empty .big { font-size:26px; color:var(--dsw-alias-border-l2); }
.pv-missing {
  border:1px solid var(--dsw-alias-state-error-primary); border-radius:8px;
  padding:10px; background:color-mix(in srgb, var(--dsw-alias-state-error-primary) 6%, var(--dsw-alias-bg-layer-1));
}
.pv-missing b { font-size:12px; color:var(--dsw-alias-state-error-primary); }
.pv-missing p { margin:4px 0 0; font-size:10.5px; color:var(--dsw-alias-label-secondary); }
.pv-missing code {
  display:inline-block; margin-top:5px; font-family:var(--k-mono); font-size:9.5px;
  color:var(--dsw-alias-state-error-primary);
}

/* Markdown */
.md { font-size:12px; line-height:1.62; color:var(--dsw-alias-label-primary); overflow-wrap:anywhere; }
.md p, .md li, .md blockquote, .md h1, .md h2, .md h3 { overflow-wrap:anywhere; }
.md code { overflow-wrap:anywhere; word-break:break-word; }
.md h1 { font-size:16px; line-height:1.35; margin:0 0 8px; letter-spacing:.005em; }
.md h2 { font-size:13.5px; margin:14px 0 5px; padding-bottom:3px; border-bottom:1px solid var(--dsw-alias-border-l1); }
.md h3 { font-size:12.5px; margin:10px 0 4px; }
.md p { margin:5px 0; }
.md ul, .md ol { margin:5px 0; padding-left:18px; }
.md li { margin:1px 0; }
.md code {
  font-family:var(--k-mono); font-size:10.5px; padding:0 3px; border-radius:3px;
  background:var(--k-chip); border:1px solid var(--dsw-alias-border-l1);
}
.md pre.md-pre {
  margin:7px 0; padding:7px; border-radius:6px; overflow:auto;
  background:var(--dsw-alias-bg-layer-2); border:1px solid var(--dsw-alias-border-l1);
}
.md pre code { padding:0; border:0; background:none; font-size:10px; }
.md blockquote {
  margin:6px 0; padding:4px 8px; border-left:2px solid var(--dsw-alias-brand-primary);
  background:color-mix(in srgb, var(--dsw-alias-brand-primary) 5%, transparent);
  color:var(--dsw-alias-label-secondary); font-size:11px;
}
.md hr { border:0; border-top:1px solid var(--dsw-alias-border-l1); margin:9px 0; }
.md strong { font-weight:650; }
.md-link { color:var(--dsw-alias-brand-primary); text-decoration:underline dotted; }

/* 源码 */
.src { display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:9px; font-family:var(--k-mono); }
.src .ln { color:var(--k-mute); text-align:right; font-size:9.5px; line-height:1.7; user-select:none; }
.src .cl { font-size:10px; line-height:1.7; white-space:pre; color:var(--dsw-alias-label-primary); }
.src.is-wrap .cl { white-space:pre-wrap; word-break:break-word; }
.tok-str { color:#0a7a4b; } html[data-theme="dark"] .tok-str { color:#7ee2a8; }
.tok-kw { color:#8b3fd6; } html[data-theme="dark"] .tok-kw { color:#c4a2ff; }
.tok-num { color:#b45309; } html[data-theme="dark"] .tok-num { color:#fbbf24; }
.tok-com { color:var(--k-mute); font-style:italic; }

/* HTML 预览示意 */
.htmlmock-head {
  display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:9.5px; color:var(--k-mute);
}
.htmlmock-head b { color:var(--dsw-alias-label-primary); font-size:11px; }
.board {
  width:100%; aspect-ratio:1/1; max-width:300px; margin:0 auto;
  display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
  border:2px solid #e6edfb; border-radius:10px; overflow:hidden;
  box-shadow:0 6px 18px rgba(27,37,64,.16); background:#f7faff;
}
.sq { position:relative; }
.sq.a { background:#ffffff; }
.sq.b { background:#eaf1ff; }
.sq i {
  position:absolute; inset:22%; border-radius:50%;
  box-shadow:inset -1px -2px 0 rgba(0,0,0,.18), 0 1px 2px rgba(27,37,64,.25);
}
.sq i.c0 { background:#ff5c7a; } .sq i.c1 { background:#ffb020; }
.sq i.c2 { background:#22c8a0; } .sq i.c3 { background:#3d8bff; }
.htmlmock-foot {
  margin-top:8px; display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:9.5px; color:var(--k-mute);
}
.htmlmock-foot span {
  padding:2px 9px; border-radius:999px; background:#3d8bff; color:#fff; font-size:10px;
}
.htmlmock-note { margin-top:8px; font-size:9px; line-height:1.5; color:var(--k-mute); text-align:center; }

/* 底部浮动切换条 */
.switcher {
  position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
  z-index:90; display:flex; align-items:center; gap:4px;
  padding:4px 6px; border-radius:999px;
  background:#111827; color:#f9fafb;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 12px 30px rgba(17,24,39,.35), 0 2px 8px rgba(17,24,39,.25);
  font-size:11px; user-select:none;
}
.switcher button {
  width:26px; height:26px; border:0; border-radius:50%;
  background:rgba(255,255,255,.10); color:#f9fafb; font-size:13px; line-height:1;
}
.switcher button:hover { background:rgba(255,255,255,.22); }
.sw-label {
  display:inline-flex; align-items:center; gap:6px; min-width:136px;
  justify-content:center; padding:0 4px; white-space:nowrap;
}
.sw-label b {
  display:inline-grid; place-items:center; width:18px; height:18px; border-radius:5px;
  background:rgba(255,255,255,.16); font-size:10px; font-weight:700;
}
.sw-label .sw-name { color:#e5e7eb; letter-spacing:.01em; }
.sw-hint { padding:0 6px 0 2px; font-size:9px; color:rgba(255,255,255,.45); }
@media (max-width:760px) { .sw-hint { display:none; } .sw-label { min-width:112px; } }

/* toast */
.toast-layer {
  position:fixed; top:112px; left:50%; transform:translateX(-50%);
  z-index:95; width:min(620px, calc(100vw - 40px));
  display:flex; flex-direction:column; gap:6px; pointer-events:none;
}
.toast {
  display:flex; align-items:flex-start; gap:8px; padding:8px 10px;
  border-radius:9px; border:1px solid var(--dsw-alias-border-l1);
  background:var(--dsw-alias-bg-layer-1); box-shadow:var(--k-shadow-lg);
  font-size:11.5px; line-height:1.5; animation:toastIn .18s ease-out;
  pointer-events:auto;
}
.toast.is-error { border-color:var(--dsw-alias-state-error-primary); }
.toast.is-warn { border-color:var(--dsw-alias-state-warn-primary); }
.toast.is-success { border-color:var(--dsw-alias-state-success-primary); }
.toast .ic { flex:none; font-size:13px; line-height:1.4; }
.toast .body { flex:1; min-width:0; }
.toast .title { font-weight:650; }
.toast .desc { margin:1px 0 0; color:var(--dsw-alias-label-secondary); white-space:pre-line; }
.toast .code {
  display:inline-block; margin-top:2px; padding:0 4px; border-radius:4px;
  background:var(--k-chip); font-family:var(--k-mono); font-size:9px; color:var(--dsw-alias-label-secondary);
}
.toast .close { border:0; background:none; color:var(--k-mute); font-size:13px; line-height:1; padding:0 2px; }

/* 弹窗 */
.modal-backdrop {
  position:fixed; inset:0; z-index:100; display:grid; place-items:center;
  padding:20px; background:rgba(15,23,42,.46); backdrop-filter:blur(1px);
}
.modal {
  width:min(540px, 100%); max-height:88vh; overflow:auto;
  border:1px solid var(--dsw-alias-border-l1); border-radius:12px;
  background:var(--dsw-alias-bg-layer-1); box-shadow:var(--k-shadow-lg);
  animation:modalIn .16s ease-out;
}
.modal-head {
  display:flex; align-items:flex-start; gap:10px; padding:12px 14px 8px;
  border-bottom:1px solid var(--dsw-alias-border-l1);
}
.modal-head h3 { margin:0; font-size:13.5px; font-weight:650; }
.modal-head p { margin:2px 0 0; font-size:10.5px; color:var(--dsw-alias-label-secondary); }
.modal-head .d-close { margin-left:auto; }
.modal-body { padding:11px 14px 4px; display:flex; flex-direction:column; gap:9px; }
.field { display:flex; flex-direction:column; gap:3px; }
.field > label, .field > .flabel { font-size:10.5px; color:var(--dsw-alias-label-secondary); }
.field .hint { font-size:9.5px; color:var(--k-mute); }
.field .err { font-size:10px; color:var(--dsw-alias-state-error-primary); }
.field-row { display:flex; gap:9px; flex-wrap:wrap; }
.field-row .field { flex:1 1 150px; }
.modal-foot {

  padding:10px 14px 12px; border-top:1px solid var(--dsw-alias-border-l1);
  margin-top:9px;
}
.modal-foot .spacer { flex:1; }
.modal-foot .note { font-size:9.5px; color:var(--k-mute); }
.size-seg { display:flex; gap:4px; }
.size-seg button {
  flex:1; padding:4px 8px; border-radius:6px; border:1px solid var(--dsw-alias-border-l1);
  background:var(--dsw-alias-bg-layer-1); font-size:11px; color:var(--dsw-alias-label-secondary);
}
.size-seg button.is-on {
  border-color:var(--dsw-alias-brand-primary); color:var(--dsw-alias-brand-primary);
  background:color-mix(in srgb, var(--dsw-alias-brand-primary) 9%, var(--dsw-alias-bg-layer-1));
  font-weight:600;
}
.create-notes {
  margin:0; padding:5px 7px; border-radius:6px; font-size:10px; line-height:1.5;
  border:1px dashed var(--dsw-alias-border-l1); color:var(--dsw-alias-label-secondary);
  background:var(--dsw-alias-bg-layer-2);
}
.global-badge {
  display:inline-flex; align-items:center; padding:0 5px; border-radius:999px;
  border:1px dashed var(--dsw-alias-border-l2); font-size:9px; color:var(--k-mute);
}

/* ============================================================
   9. 动画
   ============================================================ */
@keyframes shimmer { 0% { background-position:100% 0; } 100% { background-position:-100% 0; } }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes shake {
  0%,100% { transform:translateX(0); }
  25% { transform:translateX(-3px); } 75% { transform:translateX(3px); }
}
@keyframes bounceBack {
  0% { transform:translateX(0); } 30% { transform:translateX(-5px); }
  60% { transform:translateX(4px); } 100% { transform:translateX(0); }
}
@keyframes drawerIn { from { transform:translateX(14px); opacity:0; } to { transform:none; opacity:1; } }
@keyframes toastIn { from { transform:translateY(-6px); opacity:0; } to { transform:none; opacity:1; } }
@keyframes modalIn { from { transform:translateY(8px) scale(.99); opacity:0; } to { transform:none; opacity:1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

   10. 响应式
   ============================================================ */

  const d = new Date(iso);

}

function sortOldestFirst(list) {

function logNoteStartingWith(o, prefix) {

  for (let i = o.log.length - 1; i >= 0; i -= 1) {
    const note = String(o.log[i].note || '');
    if (note.toLowerCase().indexOf(hitPrefix) === 0) {

}

function artifactKind(path) {
  const ext = (path.split('.').pop() || '').toLowerCase();
  if (ext === 'md' || ext === 'mdx') return { key: 'md', label: 'Markdown', short: 'MD' };
  if (ext === 'html' || ext === 'htm') return { key: 'html', label: 'HTML', short: 'HTML' };
  if (ext === 'js' || ext === 'mjs' || ext === 'ts' || ext === 'css' || ext === 'json') {
    return { key: 'code', label: '代码', short: ext.toUpperCase().slice(0, 4) };
  }
  if (ext === 'png' || ext === 'jpg' || ext === 'jpeg' || ext === 'webp' || ext === 'gif') {
    return { key: 'image', label: '图片', short: 'IMG' };
  }
  if (ext === 'pdf') return { key: 'pdf', label: 'PDF', short: 'PDF' };
  if (ext === 'docx' || ext === 'xlsx' || ext === 'pptx') return { key: 'office', label: 'Office', short: ext.toUpperCase().slice(0, 4) };

function fileAddress(sessionId, path) {

function signBlockers(order, note) {
  const list = [];
  if (order.stage !== 'review') {
    list.push({ code: 'not_review', severity: 'warn',
      message: `工单 ${order.id} 现在是 ${order.stage}，只有 review 状态可以签收` });
  }
  if (!order.acceptance || order.acceptance.length === 0) {
    list.push({ code: 'no_acceptance', severity: 'danger',
      message: '没有验收标准：M/L 规模不能签收，先补验收标准' });
  }
  if (order.dri && order.dri === state.identity) {
    list.push({ code: 'self_sign', severity: 'danger',
      message: '验收不能由领取人自己签：切回主代理，或换一个身份签' });
  }
  if (!note || !note.trim()) {
    list.push({ code: 'note_required', severity: 'warn',
      message: '签收必须写 note：写清签收依据，或打回时要改哪一条' });
  }
  return list;
}
function gateForStage(order, target) {
  if (target === order.stage) return null;
  if (target === 'done') {
    return { code: 'done_forbidden',
      message: 'done 只能由签收产生：先改到 review，写 note 后点「签收 → done」' };
  }
  if (target === 'active' && (order.size === 'M' || order.size === 'L') && (!order.acceptance || order.acceptance.length === 0)) {
    return { code: 'acceptance_gate',
      message: `${order.size} 规模没有验收标准，不能进 active；先补验收标准（Host 会返回 acceptance_gate）` };
  }
  return null;
}
function createDowngradeReasons(size, acceptance) {
  const reasons = [];

    reasons.push({ code: 'wip',
      message: `在制已满（${occupied}/${WIP_LIMIT}）：新单先落 intake 排队，等一张在制单签收或撤单后再改阶段` });
  }
  if (size !== 'S' && acceptance.length === 0) {
    reasons.push({ code: 'acceptance_gate',
      message: `${size} 规模没有验收标准：不能进 active，也不能签收` });
  }
  return reasons;
}

    if (/^>\s?/.test(line)) {

      out.push(`<blockquote>${mdInline(line.replace(/^>\s?/, ''))}</blockquote>`);
      return;
    }
    m = line.match(/^\s*[-*]\s+(.*)$/);
    if (m) {
      if (list !== 'ul') { flushList(); out.push('<ul>'); list = 'ul'; }
      out.push(`<li>${mdInline(m[1])}</li>`);

    m = line.match(/^\s*\d+\.\s+(.*)$/);
    if (m) {
      if (list !== 'ol') { flushList(); out.push('<ol>'); list = 'ol'; }

/* ============================================================
   6. 三个方案
   ============================================================ */
function selectedOrder() {
  if (!state.selectedId) return null;
  const o = findOrder(state.selectedId);
  if (!o) return null;
  return visibleOrders().some((v) => v.id === o.id) ? o : null;
}
function laneSub(stage) {
  if (stage === 'active') return `在制 ${occupiedCount()}/${WIP_LIMIT}`;
  if (stage === 'review') {
    const over = overdueList().length;
    return over ? `超龄 ${over} · 可签收` : '可签收';
  }
  if (stage === 'done') return '由 sign 产生';
  if (stage === 'blocked') return '等外部条件';
  if (stage === 'intake') return '降级落点';
  return '';
}
function colFoot(stage) {
  if (stage === 'active') {
    return { left: `在制 ${occupiedCount()}/${WIP_LIMIT}`, right: occupiedCount() >= WIP_LIMIT ? '已满' : '有名额' };
  }
  if (stage === 'review') return { left: `超龄 ${overdueList().length}`, right: '只有这里能签收' };
  if (stage === 'intake') return { left: '降级落点', right: '新单排队' };
  if (stage === 'blocked') return { left: '需外部条件', right: '看最新日志' };
  return { left: '由 sign 产生', right: '只读' };
}
function droppedVisible() {
  return sortOldestFirst(visibleOrders().filter((o) => o.stage === 'dropped'));
}

/* ---------- A · 经典阶段列 ---------- */
function renderADrawer(o) {
  const sections = detailSections(o).map((s) =>
    `<section class="d-sec"><h4 class="d-label">${s.label}</h4>${s.body}</section>`).join('');
  return `<aside class="a-drawer" data-drawer aria-label="工单详情">
    <div class="a-drawer-scroll">
      ${renderDetailHead(o, 'close-detail')}
      ${renderStageMenu(o)}
      ${renderSignSection(o)}
      ${sections}
    </div>
  </aside>`;
}
function renderArchiveA(list) {
  const open = state.archiveOpen;
  return `<div class="a-archive${open ? ' is-open' : ''}" data-drop="dropped" style="${open ? 'flex-wrap:wrap' : ''}">
    <button type="button" class="a-archive-btn" data-act="archive-toggle">
      <span>${open ? '▾' : '▸'}</span>
      <span>dropped · ${list.length} 张</span>
      <span class="k-faint">${open ? '收起归档' : '展开归档 · 拖卡片到这里撤单（要写理由）'}</span>
    </button>
    ${open && list.length ? `<div class="a-arch-list" style="flex-basis:100%">${list.map((o) => renderCard(o, { archived: true })).join('')}</div>` : ''}
  </div>`;
}
function renderVariantA() {
  const isLoading = state.demo === 'loading';
  const isErr = state.demo === 'error';
  const counts = uniqueStageCounts();
  const cols = STAGES.map((stage) => {
    const list = ordersOfStage(stage);
    let body;
    if (isLoading) body = renderSkeletonCards('A', 2);
    else if (isErr) body = renderErrorCell('A');
    else body = list.length ? renderCards(list, 'A') : renderEmptyCell('A');
    const foot = colFoot(stage);
    return `<section class="a-col is-${stage}${state.flashStage === stage ? ' is-bad' : ''}" data-col="${stage}" data-drop="${stage}">
      <header class="a-colhead">
        <span class="stage-dot is-${stage}"></span>
        <span class="stage-key">${stage}</span>
        <span class="stage-sub">${STAGE_INFO[stage].sub}</span>
        <span class="a-count">${isLoading || isErr ? '–' : counts[stage]}</span>
      </header>
      <div class="a-colbody">${body}</div>
      <div class="a-colfoot"><span>${foot.left}</span><span>${foot.right}</span></div>
    </section>`;
  }).join('');
  const sel = selectedOrder();
  const drawer = (state.drawerOpen && sel && !isLoading && !isErr) ? renderADrawer(sel) : '';
  return `<div class="v v-a${isErr ? ' is-err' : ''}" data-view="A">
    ${renderOnboard('A')}
    <div class="a-main">
      <div class="a-board${isErr ? ' is-err' : ''}" data-board>${cols}</div>
      ${drawer}
    </div>
    ${renderArchiveA(droppedVisible())}
  </div>`;
}

/* ---------- B · 横向阶段泳道 ---------- */

    <div class="b-ins-head">${renderDetailHead(o, 'close-detail')}</div>
    <div class="b-ins-body">
      <div class="b-ins-col">${sec(map.stage)}${sec(map.size)}${sec(map.dri)}${renderStageMenu(o)}</div>
      <div class="b-ins-col">${sec(map.acceptance)}</div>
      <div class="b-ins-col">${sec(map.artifacts)}</div>

}

    <span>${open ? '▾' : '▸'} dropped · ${list.length} 张</span>

  </div>`;
}
function renderVariantB() {
  const isLoading = state.demo === 'loading';
  const isErr = state.demo === 'error';
  const counts = uniqueStageCounts();
  const lanes = STAGES.map((stage) => {
    const list = ordersOfStage(stage);
    let cards;
    if (isLoading) cards = renderSkeletonCards('B', 2);
    else if (isErr) cards = renderErrorCell('B');
    else cards = list.length ? renderCards(list, 'B') : renderEmptyCell('B');
    return `<section class="b-lane is-${stage}${state.flashStage === stage ? ' is-bad' : ''}" data-lane="${stage}" data-drop="${stage}">

    ${renderArchiveB(droppedVisible())}

/* ---------- C · 阶段轨 + 单阶段聚焦 ---------- */
function renderCStageBtn(stage, counts, isLoading, isErr, dropped) {
  const on = state.focusStage === stage ? ' is-on' : '';
  const cls = `c-stagebtn${on}${dropped ? ' is-dropped' : ''}`;
  return `<button type="button" class="${cls}" data-rail-stage="${stage}" data-act="focus-stage" data-stage="${stage}">
    <span class="stage-dot is-${stage}"></span>
    <span class="name">${stage}</span>
    <span class="n">${isLoading || isErr ? '–' : counts[stage]}</span>

  </button>`;
}
function renderCDetail(o) {
  const sections = detailSections(o).map((s) =>
    `<section class="d-sec"><h4 class="d-label">${s.label}</h4>${s.body}</section>`).join('');
  return `<div class="c-detail">
    ${renderDetailHead(o, 'close-detail')}
    ${renderStageMenu(o)}
    ${renderSignSection(o)}
    ${sections}
  </div>`;
}
function renderCPlaceholder() {
  let title = '选一张工单';
  let sub = '点中间的卡片；右侧栏只显示六项，不重复渲染文件';
  if (state.demo === 'loading') { title = '读取中…'; sub = 'GET /hyper-org/api/state'; }
  if (state.demo === 'error') { title = '读取失败'; sub = 'GET /state → 500，可在顶部重试'; }
  if (state.demo === 'empty') { title = '空看板'; sub = '「＋ 新建工单」开一张'; }
  return `<div class="c-placeholder"><span class="big">◇</span><b>${title}</b><span>${sub}</span></div>`;
}
function renderVariantC() {
  const isLoading = state.demo === 'loading';
  const isErr = state.demo === 'error';
  const counts = uniqueStageCounts();
  const focused = state.focusStage || 'review';
  const focusedList = focused === 'dropped' ? droppedVisible() : ordersOfStage(focused);
  const occ = occupiedCount();
  const gauge = Array.from({ length: WIP_LIMIT }).map((_, i) =>
    `<i class="${i < Math.min(occ, WIP_LIMIT) ? 'is-on' : ''}"></i>`).join('');
  const rail = `<aside class="c-rail" aria-label="阶段轨">
    <div class="c-wip">
      <div class="c-wip-row"><span>在制</span><b>${isLoading || isErr ? '–' : `${occ}/${WIP_LIMIT}`}</b></div>
      <div class="c-gauge">${gauge}</div>
      <div class="c-wip-row" style="margin-top:4px"><span class="k-faint">active + review + blocked</span><span class="${occ >= WIP_LIMIT ? 'c-wip-over' : 'k-faint'}">${occ >= WIP_LIMIT ? '已满' : '有名额'}</span></div>
    </div>
    ${STAGES.map((stage) => renderCStageBtn(stage, counts, isLoading, isErr, false)).join('')}
    ${renderCStageBtn('dropped', counts, isLoading, isErr, true)}
    <p class="c-railnote">阶段轨是筛选器：C 方案不拖拽，改阶段走右侧菜单。</p>
  </aside>`;
  const oldest = focusedList.length ? Math.max.apply(null, focusedList.map((o) => o.ageHours || 0)) : 0;
  const oldestText = oldest >= 72
    ? `最老超龄 ${Math.floor(oldest / 24)} 天`
    : (oldest >= 24 ? `最老 ${Math.floor(oldest / 24)} 天` : `最老 ${Math.max(1, Math.round(oldest))} 小时`);
  const head = `<div class="c-streamhead" data-c-streamhead>
    <b>${focused}</b>
    <span class="k-mut">${isLoading || isErr ? '—' : `${focusedList.length} 张`}</span>
    <span class="sep">·</span>
    <span>${isLoading || isErr ? '读取中…' : (focusedList.length ? oldestText : '没有卡片')}</span>
    <span class="spacer"></span>
    <span class="hint">主交互：选阶段 → 点卡片 → 右侧六项</span>
  </div>`;
  let stream;
  if (isLoading) {
    stream = `<span class="skel skel-card"></span><span class="skel skel-card"></span><span class="skel skel-card"></span>`;
  } else if (isErr) {
    stream = `${renderErrorPanel()}<div class="err-cell" style="min-height:120px">这一阶段的卡片没有加载出来<br><span class="k-mono">GET /state → 500</span><br><button type="button" class="k-btn k-btn-sm" data-act="retry" style="margin-top:5px">重试</button></div>`;
  } else if (state.demo === 'empty') {
    stream = `<div class="c-empty-main">
      <div class="empty-ic">＋</div>
      <b>还没有工单</b>
      <p>空看板不是错误：.dsh/org/orders/ 下没有可解析的工单。用「＋ 新建工单」开一张，或回到会话里让主代理 org_order create。</p>
      ${emptyStepsHtml()}
      <button type="button" class="k-btn k-btn-primary k-btn-sm" data-act="new" style="margin-top:3px">＋ 新建工单</button>
    </div>`;
  } else if (!focusedList.length) {
    stream = `<div class="c-empty-main">
      <b>${focused} 阶段没有卡片</b>
      <p>${focused === 'review' ? '没有待验收的单；去 active 看正在做的事。' : '这个阶段暂时是空的。'}</p>
      ${focused === 'intake' ? '<button type="button" class="k-btn k-btn-primary k-btn-sm" data-act="new">＋ 新建工单</button>' : ''}
    </div>`;
  } else {
    stream = renderCards(focusedList, 'C', { nodrag: true });
  }
  const sel = selectedOrder();
  const inspector = (sel && !isLoading && !isErr) ? renderCDetail(sel) : renderCPlaceholder();
  return `<div class="v v-c${isErr ? ' is-err' : ''}" data-view="C">
    ${rail}
    <main class="c-center">
      ${head}
      <div class="c-stream" data-stream>${stream}</div>
    </main>
    <aside class="c-inspector" data-inspector>${inspector}</aside>
  </div>`;
}
function renderVariant() {
  if (state.variant === 'B') return renderVariantB();
  if (state.variant === 'C') return renderVariantC();
  return renderVariantA();
}

/* ============================================================
   7. 总渲染
   ============================================================ */
function updateSwitcher() {
  const meta = VARIANTS.filter((v) => v.key === state.variant)[0] || VARIANTS[0];
  const key = $('#swKey');
  const name = $('#swName');
  if (key) key.textContent = meta.key;
  if (name) name.textContent = meta.name;
}
function renderPreviewOnly() {
  const app = $('#app');
  if (app) app.classList.toggle('pv-open', !!state.preview.open);
  const col = $('#previewCol');
  if (col) col.innerHTML = renderPreviewColumn();
}
function render() {
  state.version += 1;
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.setAttribute('data-variant', state.variant);
  const app = $('#app');
  if (app) app.classList.toggle('pv-open', !!state.preview.open);
  const stats = $('#stats');
  if (stats) stats.innerHTML = renderStats();
  $$('#tools .seg-btn').forEach((btn) => {
    btn.classList.toggle('is-on', btn.dataset.id === state.identity);
  });
  const themeBtn = $('#themeBtn');
  if (themeBtn) themeBtn.textContent = state.theme === 'dark' ? '亮色' : '暗色';
  const newBtn = $('#newBtn');
  if (newBtn) newBtn.disabled = state.demo === 'loading' || state.demo === 'error';
  const refreshBtn = $('#refreshBtn');
  if (refreshBtn) refreshBtn.disabled = state.demo === 'loading';
  const demoSelect = $('#demoState');
  if (demoSelect) demoSelect.value = state.demo;
  const banners = $('#bannerLayer');
  if (banners) {
    banners.innerHTML = (state.demo === 'loading' ? renderLoadStrip() : '')
      + (state.demo === 'error' ? renderErrorPanel() : '')
      + renderBanner();
  }
  const root = $('#variantRoot');
  if (root) root.innerHTML = renderVariant();
  const col = $('#previewCol');
  if (col) col.innerHTML = renderPreviewColumn();
  const toastLayer = $('#toastLayer');
  if (toastLayer) toastLayer.innerHTML = renderToast();
  renderModal();
  updateSwitcher();
}

/* ============================================================
   8. 交互动作
   ============================================================ */
state.loadToken = 0;
let toastTimer = null;

function showToast(t) {
  state.toast = t;
  const layer = $('#toastLayer');
  if (layer) layer.innerHTML = renderToast();
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    state.toast = null;
    const el = $('#toastLayer');
    if (el) el.innerHTML = '';
  }, 5600);
}
function hideToast() {
  state.toast = null;
  if (toastTimer) clearTimeout(toastTimer);
  const el = $('#toastLayer');

  e.preventDefault();
  try { e.dataTransfer.dropEffect = 'move'; } catch (err) { /* 忽略 */ }
  $$('[data-drop]').forEach((z) => z.classList.toggle('is-drag', z === zone));
});
document.addEventListener('dragleave', (e) => {
  const zone = e.target.closest ? e.target.closest('[data-drop]') : null;
  if (!zone) return;
  if (e.relatedTarget && zone.contains(e.relatedTarget)) return;
  zone.classList.remove('is-drag');
});
document.addEventListener('drop', (e) => {
  const zone = e.target.closest ? e.target.closest('[data-drop]') : null;
  if (!zone) return;
  e.preventDefault();
  const id = state.dragId || (e.dataTransfer ? e.dataTransfer.getData('text/plain') : '');
  cleanupDrag();
  if (id) tryMove(id, zone.dataset.drop);
});

$('#swPrev').addEventListener('click', () => cycleVariant(-1));
$('#swNext').addEventListener('click', () => cycleVariant(1));

/* ============================================================
   10. 启动
   ============================================================ */
function initFromUrl() {
  const params = new URLSearchParams(location.search);
  const variant = String(params.get('variant') || 'A').toUpperCase();
  if (VARIANTS.some((v) => v.key === variant)) state.variant = variant;
  const theme = String(params.get('theme') || 'light').toLowerCase();
  if (theme === 'dark' || theme === 'light') state.theme = theme;
  const demo = String(params.get('demo') || 'normal').toLowerCase();
  if (['normal', 'empty', 'loading', 'error', 'noproject'].indexOf(demo) >= 0) {
    state.demo = demo;
    state.banner = demoBanner(demo);
  }
  if (state.variant === 'C') {
    const first = ordersOfStage(state.focusStage)[0] || ordersOfStage('review')[0];
    if (first) {
      state.selectedId = first.id;
      state.focusStage = first.stage;
    }
  }
}

/* 调试口：给无头验证与手工玩用；不是生产 API。 */
window.__kanban = {
  state,
  get orders() { return ORDERS; },
  render,
  setVariant: applyVariant,
  setDemoState,
  selectOrder,
  openPreview,
  closePreview,
  backDetail,
  tryMove,
  sign: doSign,
  create: demoCreate,
  addSignNote(id, text) {
    const ta = document.querySelector(`[data-sign-note="${id}"]`);
    if (ta) { ta.value = text; updateSignControls(id); }
    else { state.signNotes[id] = text; }
  },
  fileAddress,
  mdToHtml,
  visibleOrders,
  occupiedCount,
  signBlockers,
};

initFromUrl();
render();
window.__protoReady = true;
})();
</script>
